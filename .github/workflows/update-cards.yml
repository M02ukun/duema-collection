name: Update card list
on:
  schedule:
    - cron: '0 18 * * 5'   # 毎週土曜 3:00 (JST)
  workflow_dispatch:
    inputs:
      products:
        description: '取得するパック（カンマ区切り、空なら全部）'
        required: false
        default: ''
      max_details:
        description: '1回で取得する詳細ページの上限'
        required: false
        default: '30000'
permissions:
  contents: write
concurrency:
  group: update-cards
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch card list
        env:
          PRODUCTS: ${{ github.event.inputs.products }}
          MAX_DETAILS: ${{ github.event.inputs.max_details || '30000' }}
        run: |
          ARGS="--max-details $MAX_DETAILS"
          if [ -n "$PRODUCTS" ]; then ARGS="$ARGS --products $PRODUCTS"; fi
          node scripts/fetch-cards.mjs $ARGS
      - name: Keep a copy of the result
        uses: actions/upload-artifact@v4
        with:
          name: cards-json
          path: public/data/cards.json
          retention-days: 7
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          # 取得中に main が進んでいても push できるよう、最新の main の上に cards.json だけ載せ直す
          cp public/data/cards.json "$RUNNER_TEMP/cards.json"
          for i in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/cards.json" public/data/cards.json
            git add public/data/cards.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -m "カードリストを更新"
            git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
